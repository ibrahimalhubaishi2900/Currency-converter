<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FxPulse | Global Currency Converter</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="converter-card">
    <header>
      <h1>FxPulse</h1>
      <p class="subtitle">Real-Time Global Exchange Rates</p>
    </header>

    <div class="input-group">
      <label for="amount">Amount</label>
      <input type="number" id="amount" value="1" min="0.01" step="any" />
    </div>

    <div class="currency-row">
      <div class="select-box">
        <label for="from-currency">From</label>
        <select id="from-currency"></select>
      </div>

      <button id="swap-btn" title="Swap Currencies">⇄</button>

      <div class="select-box">
        <label for="to-currency">To</label>
        <select id="to-currency"></select>
      </div>
    </div>

    <div class="result-box">
      <div id="loading" class="hidden">Loading exchange rates...</div>
      <div id="result-container">
        <span class="rate-label">Converted Amount</span>
        <h2 id="result-text">--</h2>
        <p id="exchange-rate-info" class="rate-info">--</p>
      </div>
    </div>

    <footer>
      <p class="attribution">Rates provided by <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
